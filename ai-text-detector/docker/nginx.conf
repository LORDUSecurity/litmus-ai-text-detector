# Serves the built Angular SPA and reverse-proxies the API to the Flask backend.
#
# The proxy makes the API SAME-ORIGIN with the page (browser -> nginx -> backend), so
# the browser never runs a CORS check against the backend's loopback-only Allow-Origin
# policy, and the signed session cookie flows automatically in both directions.
#
# This file is mounted at /etc/nginx/conf.d/default.conf (frontend/Dockerfile), so its top
# level is nginx's http{} context -- which is the only place `map` and `limit_req_zone` are
# legal. `nginx -t` inside the image checks both before the container takes traffic.

# The two routes worth an address window. Everything else is keyed to "" and so is not counted:
# a detection is a minutes-long call that must not queue behind someone else's login attempts.
map $request_uri $throttle_key {
    default            "";
    /api/auth/login    $binary_remote_addr;
    /api/auth/register $binary_remote_addr;
}

# Six sign-in attempts a minute per address, with a burst that covers a person who mistypes twice
# and a proxy that reports one shared address for a whole office.
#
# The backend throttles failures itself (`backend/security.py`), but its counters are per gunicorn
# worker, so a guesser who spreads attempts gets `limit x workers` tries. This window does not move
# with the process count. It counts requests, not failures, so the price of locking it tighter is
# the owner being unable to sign in.
limit_req_zone $throttle_key zone=auth:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Stop nginx volunteering its exact version into every `Server:` header and into error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the text assets; the hashed JS/CSS bundles benefit the most.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # /extract accepts documents up to the backend's 20 MB ceiling.
    client_max_body_size 20m;

    # SPA fallback: any unknown path serves index.html so Angular routes it.
    #
    # The same header set the Flask layer puts on every API response goes here too, because in this
    # deploy the document that carries the application is a FILE, not a route: nginx answers
    # index.html, the hashed bundles and /research/report.html without ever touching Python. A CSP
    # that only covers /api/* would be a policy around the JSON and no policy around the page.
    # `always` matters: without it nginx drops add_header on 404s and 413s, and an error page is
    # exactly the response an attacker reads.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options  "nosniff"  always;
        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        try_files $uri $uri/ /index.html;
    }

    # The trailing slash on proxy_pass strips the /api prefix, matching the dev proxy's
    # pathRewrite { "^/api": "" }. So /api/detect -> backend:8787/detect.
    #
    # A detection can take ~2 minutes when the shared NVIDIA pool is saturated, and the
    # backend adds its own +30 s margin, so the read timeout must clear that.
    #
    # 330 s, not 300: the chain is lane timeout_ms (240 s on the shipped primary) -> backend wait
    # (+30 s = 270 s) -> gunicorn --timeout 285 s -> this. Each tier has to sit above the one
    # inside it, or the outer layer kills a request the inner layer was still legitimately waiting
    # for -- which is exactly how a working 214 s glm detection used to come back as a 502.
    location /api/ {
        proxy_pass http://backend:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    330s;
        proxy_send_timeout    330s;
        # Do not buffer: let a slow verdict reach the browser as soon as the backend sends it.
        proxy_buffering         off;
        proxy_request_buffering off;
        # Only the two mapped routes have a non-empty key, so this line costs every other call
        # nothing: nginx does not count a request whose key evaluates to "".
        limit_req zone=auth burst=12 nodelay;
        # Answer the window in the body the SPA already reads. nginx's built-in 429 page is HTML,
        # and Angular's HttpClient is asking for JSON, so a throttled sign-in would show the person
        # a parse error instead of "try again in a minute".
        error_page 429 = @rate_limited;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many sign-in attempts from this address. Wait a minute and try again.","error_code":"RATE_LIMITED"}';
    }
}
