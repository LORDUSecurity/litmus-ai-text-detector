# Serves the built Angular SPA and reverse-proxies the API to the Flask backend.
#
# The proxy makes the API SAME-ORIGIN with the page (browser -> nginx -> backend), so
# the browser never runs a CORS check against the backend's loopback-only Allow-Origin
# policy, and the signed session cookie flows automatically in both directions.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the text assets; the hashed JS/CSS bundles benefit the most.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # /extract accepts documents up to the backend's 20 MB ceiling.
    client_max_body_size 20m;

    # SPA fallback: any unknown path serves index.html so Angular routes it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The trailing slash on proxy_pass strips the /api prefix, matching the dev proxy's
    # pathRewrite { "^/api": "" }. So /api/detect -> backend:8787/detect.
    #
    # A detection can take ~2 minutes when the shared NVIDIA pool is saturated, and the
    # backend adds its own +30 s margin, so the read timeout must clear that.
    #
    # 330 s, not 300: the chain is lane timeout_ms (240 s on the shipped primary) -> backend wait
    # (+30 s = 270 s) -> gunicorn --timeout 285 s -> this. Each tier has to sit above the one
    # inside it, or the outer layer kills a request the inner layer was still legitimately waiting
    # for -- which is exactly how a working 214 s glm detection used to come back as a 502.
    location /api/ {
        proxy_pass http://backend:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    330s;
        proxy_send_timeout    330s;
        # Do not buffer: let a slow verdict reach the browser as soon as the backend sends it.
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
